name: Patch location UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-location-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current state and patch only requested UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          header='    <button class="location-btn" id="locateBtn" type="button">📍 Konumumu Kullan</button>\n'
          hero='        <button class="primary gold-btn" id="heroLocateBtn" type="button">📍 Konumumu Kullan</button>\n        <label class="city-picker"><span>Şehir</span><select id="citySelect" aria-label="Şehir seç"></select></label>'
          assert s.count(header)==1, 'Header konum butonu beklenen durumda değil'
          assert s.count(hero)==1, 'Hero konum/şehir alanı beklenen durumda değil'
          assert 'id="heroCitySearch"' not in s, 'Şehir Ara zaten eklenmiş'
          new_hero='        <button class="primary gold-btn" id="locateBtn" type="button">📍 Konumumu Kullan</button>\n        <a class="secondary-link" id="heroCitySearch" href="#cities">🔎 Şehir Ara</a>\n        <label class="city-picker"><span>Şehir</span><select id="citySelect" aria-label="Şehir seç"></select></label>'
          s=s.replace(header,'',1).replace(hero,new_hero,1)
          assert 'id="heroLocateBtn"' not in s
          assert s.count('id="locateBtn"')==1
          assert 'id="heroCitySearch" href="#cities">🔎 Şehir Ara</a>' in s
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify existing location wiring remains intact
        run: |
          grep -F '$("locateBtn")?.addEventListener("click",locate);' public/app.js
          grep -F '$("citySearch")?.addEventListener("input",e=>renderCityLinks(e.target.value));' public/app.js
      - name: Commit UI change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Fix location and city search controls"
          git push

# trigger
