name: Publish SEO Gold 2026-09-10
on:
  push:
    paths:
      - '.github/workflows/publish-seo-2026-09-08-gold.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publish verified SEO news
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/seo-posts.json';
          const posts = JSON.parse(fs.readFileSync(path, 'utf8'));
          const slug = 'ons-altin-dolar-gerilerken-yukseldi-10-eylul-2026';
          if (posts.some(p => p.slug === slug)) process.exit(0);
          posts.push({
            id: '2026-09-10-ons-altin-dolar-gerilerken-yukseldi', slug, slot: 'gundem', dayKey: '2026-09-10',
            title: 'Ons Altın Dolar Gerilerken Yükseldi: Gözler ABD Enflasyon Verilerinde',
            description: 'Ons altın 10 Eylül 2026’da zayıflayan doların desteğiyle 4.405 dolar civarında yükseldi. Piyasaların odağında ABD ÜFE ve TÜFE verileri ile Fed kararı var.',
            category: 'altin', status: 'published', image: '', sourceType: 'editorial-web', sourceName: 'Reuters',
            sourceUrl: 'https://www.reuters.com/world/india/gold-edges-higher-weaker-dollar-us-inflation-data-focus-2026-09-10/',
            publishedAt: '2026-09-10T11:04:03.000Z', updatedAt: '2026-09-10T11:04:03.000Z',
            body: [
              'Altın fiyatları 10 Eylül 2026 Perşembe günü zayıflayan doların desteğiyle sınırlı yükseldi. Reuters verilerine göre spot ons altın yüzde 0,1 artışla 4.405,09 dolar seviyesinde işlem gördü. ABD altın vadeli işlemleri ise yüzde 0,3 düşüşle 4.448,80 dolar civarında seyretti.',
              'Altındaki hareketin önemli nedenlerinden biri dolar endeksindeki gevşeme oldu. Doların değer kaybetmesi, dolar cinsinden fiyatlanan altını diğer para birimlerini kullanan alıcılar açısından görece daha erişilebilir hale getirebiliyor. Küresel borç görünümüne ilişkin endişeler de değerli metal piyasasının yakından izlediği başlıklar arasında bulunuyor.',
              'Piyasaların kısa vadeli odağında ABD enflasyon verileri var. ABD üretici fiyat endeksinin 10 Eylül’de, tüketici fiyat endeksinin ise 11 Eylül’de açıklanması bekleniyor. Veriler, ABD Merkez Bankasının 15-16 Eylül toplantısında faiz politikasına ilişkin beklentilerin şekillenmesi açısından önem taşıyor.',
              'Reuters anketine katılan ekonomistlerin çoğunluğu Fed’in eylül toplantısında politika faizini sabit tutmasını beklerken, piyasa fiyatlamalarında faiz artışı olasılığı da yakından takip ediliyor. Enflasyon verilerinin beklentilerin üzerinde veya altında gelmesi dolar, tahvil faizleri ve altın fiyatlarında kısa vadeli oynaklığı artırabilir.',
              'Reuters verilerine göre spot gümüş yüzde 0,2 düşüşle 67,11 dolar, platin yüzde 1,2 kayıpla 1.873,84 dolar ve paladyum yüzde 0,2 düşüşle 1.350,82 dolar seviyesinde işlem gördü. Bu içerik yalnızca güncel piyasa gelişmelerini aktarmak amacıyla hazırlanmıştır ve yatırım tavsiyesi değildir.'
            ], aiGenerated: true, aiModel: 'gpt-5.6-sol'
          });
          fs.writeFileSync(path, JSON.stringify(posts, null, 2) + '\n');
          NODE
      - name: Verify
        run: |
          node -e "const p=require('./data/seo-posts.json'); const x=p.find(x=>x.slug==='ons-altin-dolar-gerilerken-yukseldi-10-eylul-2026'); if(!x||x.status!=='published'||!x.sourceUrl||x.body.length<4) process.exit(1);"
      - name: Commit published news
        run: |
          git config user.name 'sevvalgcn'
          git config user.email 'actions@github.com'
          git add data/seo-posts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '10 Eylül ons altın SEO haberini yayınla'
          git push
