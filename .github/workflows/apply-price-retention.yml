name: Apply price retention fix

on:
  push:
    branches:
      - fix/keep-last-good-prices

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/patch-price-retention.js
      - name: Verify syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Commit patched app
        run: |
          if git diff --quiet -- public/app.js; then
            echo "No app.js changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js
          git commit -m "Altın fiyatlarını geçici veri kesintisinde koru"
          git push
